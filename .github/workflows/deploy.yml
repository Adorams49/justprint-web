name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar el sitio (build.py)
        run: python build.py

      # Solo se publica lo necesario para el sitio: build.py, data/, *.bat y
      # LEEME.txt se quedan en el repositorio pero nunca quedan públicos.
      - name: Preparar carpeta a publicar
        run: |
          mkdir publish
          cp -r index.html 404.html assets servicios sitemap.xml robots.txt publish/
          echo "justprinthn.com" > publish/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
